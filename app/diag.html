<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Diagnostic</title>
<style>
  body { font: 15px/1.45 system-ui, sans-serif; margin: 0; padding: 14px 14px 32px; background: #fff; color: #111; }
  h1 { font-size: 1.1rem; margin: 6px 0 4px; }
  p { margin: 4px 0 12px; color: #444; }
  a { color: #1a73e8; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  button { font: inherit; padding: 11px 15px; border: 0; border-radius: 10px; background: #1a73e8; color: #fff; }
  button.secondary { background: #5f6368; }
  button[hidden] { display: none; }
  button:disabled { opacity: 0.6; }
  #summary { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 6px; }
  #summary li { padding: 9px 11px; border-radius: 8px; background: #f3f4f6; border-left: 5px solid #9aa0a6; }
  #summary li.ok { border-left-color: #1e8e3e; }
  #summary li.warn { border-left-color: #f9ab00; background: #fff8e1; }
  #summary li.bad { border-left-color: #d93025; background: #fdecea; }
  pre { white-space: pre-wrap; word-break: break-word; background: #f3f4f6; padding: 10px; border-radius: 8px; font-size: 12.5px; user-select: text; -webkit-user-select: text; }
  @media (prefers-color-scheme: dark) {
    body { background: #111; color: #eee; } p { color: #aaa; } pre { background: #222; } a { color: #8ab4f8; }
    #summary li { background: #222; } #summary li.warn { background: #33290a; } #summary li.bad { background: #3a1512; }
  }
</style>
</head>
<body data-diag data-app-id="heraldis" data-legacy="">
<a href="index.html">← Retour à l'appli</a>
<h1>Diagnostic</h1>
<p>Lecture seule : cette page affiche ce que l'appli a en mémoire sur cet appareil, et si tout est cohérent (versions, cache, données). Rien n'est modifié ni envoyé. Touche « Copier » (ou « Partager ») puis colle le rapport dans la conversation.</p>
<div class="row">
  <button id="copy" type="button">Copier le rapport</button>
  <button id="share" type="button" hidden>Partager</button>
  <button id="save" type="button" class="secondary">Enregistrer (.txt)</button>
  <button id="update-check" type="button" class="secondary">Vérifier les mises à jour</button>
  <button id="refresh" type="button" class="secondary">Relancer</button>
</div>
<ul id="summary"></ul>
<pre id="out">Chargement…</pre>
<script src="engine/engine.js"></script>
<script src="engine/diag.js"></script>
</body>
</html>
